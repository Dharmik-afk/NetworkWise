<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#282828">
    <title>Speed map · Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="/map.css">
</head>
<body>
    <script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embedded-map');</script>
    <nav class="map-bar" aria-label="Site navigation">
        <div class="map-bar-brand">
            <span class="map-eyebrow">Pulse</span>
            <span class="map-bar-title">Network speed map</span>
        </div>
        <div class="map-bar-end">
            <p class="map-bar-desc">Topographic contours from GPS-tagged tests</p>
            <a class="map-bar-link" href="/">← Speed test</a>
        </div>
    </nav>

    <main class="map-shell">
        <section class="map-toolbar" aria-label="Map controls">
            <label for="speedMode">Metric</label>
            <select id="speedMode">
                <option value="downloadSpeedMbps">Download speed</option>
                <option value="uploadSpeedMbps">Upload speed</option>
            </select>
            <button id="locateButton" type="button">Show my location</button>
            <p id="mapStatus" role="status">Loading GPS-tagged speed samples…</p>
        </section>

        <section class="map-frame" aria-label="Network speed map">
            <div id="map"></div>
            <div class="legend" aria-live="polite">
                <strong id="legendTitle">Download speed</strong>
                <div class="legend-lines" aria-hidden="true"><i></i><i></i><i></i></div>
                <div class="legend-values"><span id="legendMin">—</span><span id="legendMax">—</span></div>
                <small>Mbps · interpolated contour</small>
            </div>
        </section>
        <p class="map-note">The contours estimate values between measurements; they are not a coverage guarantee. Map tiles © OpenStreetMap contributors.</p>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="/map.js"></script>
</body>
</html>
